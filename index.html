<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello World · MasterD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="stage">
    <p class="eyebrow">
      <span class="dot" aria-hidden="true"></span>
      DEPLOYED · GITHUB PAGES
    </p>

    <h1 class="headline">
      <span class="line">Hello</span>
      <span class="line accent">World</span>
    </h1>

    <p class="sub">
      一个静态站点。纯 HTML / CSS / JS，零构建依赖，
      从建立到公开访问不到一分钟。
    </p>

    <div class="meta">
      <div class="meta-item">
        <span class="k">Owner</span>
        <span class="v">tianxiangy52-ui</span>
      </div>
      <div class="meta-item">
        <span class="k">Repo</span>
        <span class="v">hello-world</span>
      </div>
      <div class="meta-item">
        <span class="k">Stack</span>
        <span class="v">HTML · CSS · JS</span>
      </div>
      <div class="meta-item">
        <span class="k">Build</span>
        <span class="v">None</span>
      </div>
    </div>

    <div class="actions">
      <a class="btn primary" href="https://github.com/tianxiangy52-ui/hello-world" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.6 4.7 18.6 5 18.6 5c.7 1.6.3 2.7.1 3.1.8.8 1.3 1.9 1.3 3.1 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
        View Source
      </a>
      <button class="btn ghost" id="pingBtn" type="button">Ping it</button>
    </div>

    <p class="stat" id="stat">点击按钮测试站点运行状态</p>
  </main>

  <footer class="foot">
    <span>MasterD</span>
    <span class="sep">/</span>
    <span>区块链智能体</span>
    <span class="sep">/</span>
    <span id="clock">--:--:--</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
